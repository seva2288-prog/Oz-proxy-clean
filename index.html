<style>

/* --- СТАТУСЫ МАТЧЕЙ --- */
.match-status {
    font-size: 11px;

}
.match-status.future { background: #2ecc71; color: #000; }

/* --- ФИЛЬТРЫ --- */
.filters-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 6px 0;
}
.filter-btn {
    padding: 4px 12px;
    border-radius: 12px;
    border: 1px solid #2a3140;
    background: #1a1f2a;
    color: #888;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s;
}
.filter-btn.active {
    background: #f7931a;
    color: #000;
    border-color: #f7931a;
}
.filter-btn:hover { background: #2a3140; }

/* --- РАЗДЕЛЕНИЕ НА БЛОКИ --- */
.section-block {
    margin: 8px 0;
    padding: 6px 0;
    border-bottom: 1px solid #2a3140;
}
.section-block:last-child { border-bottom: none; }
.section-title {
    font-size: 11px;
    font-weight: 700;
    color: #888;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* --- ПРИОРИТЕТНЫЙ МАТЧ --- */
.match-priority-high {

}
.match-priority-medium {

}
.match-priority-low {

}

/* --- УВЕДОМЛЕНИЯ --- */
.notification-banner {

    padding: 8px 12px;

    align-items: center;
    gap: 8px;
    font-size: 12px;
    animation: slideDown 0.3s ease;
}
.notification-banner .icon { font-size: 16px; }

    margin-left: auto;
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 14px;
}
@keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* --- КНОПКА ОБНОВЛЕНИЯ С ТАЙМЕРОМ --- */
.refresh-with-timer {

    align-items: center;

}
